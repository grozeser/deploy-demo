# HTTP → HTTPS, статика лендинга с кэшем, /api/ — в контейнер с API
server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }  # для certbot на сервере
    location / { return 301 https://$host:8448$request_uri; }        # на сервере порт убрать
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    root /var/www/site;
    location / { try_files $uri $uri/ =404; }
    location ~* \.(css|js|png|jpg|svg|woff2)$ { expires 30d; add_header Cache-Control "public"; add_header Strict-Transport-Security "max-age=31536000" always; }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 64k;
    }
}
